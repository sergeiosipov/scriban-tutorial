<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Scriban Interactive Training</title>
  <base href="/" />
  <script>
    // Apply the persisted theme synchronously, before any CSS or component renders,
    // so the boot shell already shows the right colour scheme.
    (function() {
      try {
        var t = localStorage.getItem('scriban-tutorial:theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* localStorage unavailable — stick with default light */ }
    })();
  </script>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="ScribanTutorial.styles.css" />
  <script type="importmap">
  {
    "imports": {
      "codemirror":                  "./lib/codemirror/codemirror.js",
      "@codemirror/state":           "./lib/codemirror/codemirror_state.js",
      "@codemirror/view":            "./lib/codemirror/codemirror_view.js",
      "@codemirror/language":        "./lib/codemirror/codemirror_language.js",
      "@codemirror/commands":        "./lib/codemirror/codemirror_commands.js",
      "@codemirror/search":          "./lib/codemirror/codemirror_search.js",
      "@codemirror/autocomplete":    "./lib/codemirror/codemirror_autocomplete.js",
      "@codemirror/lint":            "./lib/codemirror/codemirror_lint.js",
      "@lezer/common":               "./lib/codemirror/lezer_common.js",
      "@lezer/highlight":            "./lib/codemirror/lezer_highlight.js",
      "@lezer/lr":                   "./lib/codemirror/lezer_lr.js",
      "@marijn/find-cluster-break":  "./lib/codemirror/marijn_find-cluster-break.js",
      "style-mod":                   "./lib/codemirror/style-mod.js",
      "w3c-keyname":                 "./lib/codemirror/w3c-keyname.js",
      "crelt":                       "./lib/codemirror/crelt.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div class="boot-shell">
      <aside class="boot-shell__nav">
        <div class="boot-shell__brand-skel"></div>
        <div class="boot-shell__nav-skel"></div>
        <div class="boot-shell__nav-skel"></div>
        <div class="boot-shell__nav-skel"></div>
      </aside>
      <main class="boot-shell__main">
        <div class="boot-shell__title-skel"></div>
        <div class="boot-shell__body-skel"></div>
        <div class="boot-shell__body-skel"></div>
      </main>
    </div>
  </div>

  <div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">&times;</span>
  </div>

  <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
