<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Scriban Interactive Training</title>
  <!-- Defense-in-depth CSP. We're a static SPA whose only origin is the page itself.
       'wasm-unsafe-eval' is required for Blazor WASM's runtime. 'unsafe-inline'
       on script-src is for the inline <script type="importmap"> below — until we
       commit to maintaining a CSP hash for it, dropping unsafe-inline would block
       bare specifier resolution for CodeMirror. 'unsafe-inline' on style-src is
       needed for Blazor's scoped CSS isolation and CodeMirror's runtime style
       injection. The two boot scripts (spa-redirect.js, theme-boot.js) are
       external files served from 'self'. No third-party origins are whitelisted.
       Note: `frame-ancestors` is ignored when delivered via <meta>; if framing
       protection ever matters, set it as a server response header. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data:;
                 font-src 'self' data:;
                 connect-src 'self';
                 base-uri 'self';
                 form-action 'none';" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <script src="js/spa-redirect.js"></script>
  <base href="/" />
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="ScribanTutorial.styles.css" />
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state":           "./lib/codemirror/codemirror_state.js",
      "@codemirror/view":            "./lib/codemirror/codemirror_view.js",
      "@codemirror/language":        "./lib/codemirror/codemirror_language.js",
      "@codemirror/commands":        "./lib/codemirror/codemirror_commands.js",
      "@lezer/common":               "./lib/codemirror/lezer_common.js",
      "@lezer/highlight":            "./lib/codemirror/lezer_highlight.js",
      "@lezer/lr":                   "./lib/codemirror/lezer_lr.js",
      "@marijn/find-cluster-break":  "./lib/codemirror/marijn_find-cluster-break.js",
      "style-mod":                   "./lib/codemirror/style-mod.js",
      "w3c-keyname":                 "./lib/codemirror/w3c-keyname.js",
      "crelt":                       "./lib/codemirror/crelt.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div class="boot-shell">
      <aside class="boot-shell__nav">
        <div class="boot-shell__brand-skel"></div>
        <div class="boot-shell__nav-skel"></div>
        <div class="boot-shell__nav-skel"></div>
        <div class="boot-shell__nav-skel"></div>
      </aside>
      <main class="boot-shell__main">
        <div class="boot-shell__title-skel"></div>
        <div class="boot-shell__body-skel"></div>
        <div class="boot-shell__body-skel"></div>
      </main>
    </div>
  </div>

  <div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">&times;</span>
  </div>

  <script src="js/nav-scroll.js"></script>
  <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
