name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Opt into Node.js 24 for JavaScript actions so the Node 20 deprecation
  # warnings stop firing. GitHub Actions forces Node 24 by default from
  # 2026-06-02; this just brings the date forward.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (not tag refs)
      # for supply-chain safety. The tag comment after each `uses:` is
      # human-readable context — Dependabot watches these and opens PRs
      # to bump the SHA when the upstream tag moves. See
      # .github/dependabot.yml.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore (solution)
        # Restore the whole solution so ContentBuilder's obj/project.assets.json
        # exists by the time the WASM publish triggers the BuildContent target.
        # `dotnet publish src/...` alone only restores the WASM project.
        run: dotnet restore ScribanTutorial.slnx

      - name: Check for vulnerable NuGet packages
        # `dotnet list package --vulnerable` always exits 0 — it just prints
        # what it found. To gate the build we grep the output for the marker
        # text the command emits when a vulnerability is reported. Includes
        # transitive deps so a CVE in something we don't directly reference
        # still trips the build.
        run: |
          set -euo pipefail
          output=$(dotnet list ScribanTutorial.slnx package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable"; then
            echo "::error::Vulnerable NuGet packages detected — see log above."
            exit 1
          fi

      - name: Build WASM project (fires the BuildContent MSBuild target)
        # Regenerates .html and bundle.json siblings under wwwroot/lessons
        # via the BuildContent target. BuildTargetTest asserts those siblings
        # are present and fresh; without this step the test would only see the
        # .md sources (the generated artifacts are gitignored).
        run: dotnet build src/ScribanTutorial/ScribanTutorial.csproj --configuration Release --no-restore

      - name: Run xUnit tests
        # Includes the parameterised ExerciseSolutionTests that re-runs every
        # exercise's canonical solution against its data model. Gates the
        # deploy on content correctness.
        run: dotnet test tests/ScribanTutorial.Tests/ScribanTutorial.Tests.csproj --configuration Release --no-restore

      # The publish + rewrite + upload steps are deploy-only — skipped on
      # pull_request runs so PR CI fails fast on broken tests instead of
      # spending another ~2 minutes producing an artifact that will never
      # be uploaded.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/ScribanTutorial/ScribanTutorial.csproj -c Release -o publish

      - name: Rewrite base href in index.html
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SteveSandersonMS/ghaction-rewrite-base-href@5b54862a8831e012d4f1a8b2660894415fdde8ec # v1
        with:
          html_path: publish/wwwroot/index.html
          base_href: /${{ github.event.repository.name }}/

      - name: Rewrite base href in 404.html
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SteveSandersonMS/ghaction-rewrite-base-href@5b54862a8831e012d4f1a8b2660894415fdde8ec # v1
        with:
          html_path: publish/wwwroot/404.html
          base_href: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot
          # v4.0.0 stopped including hidden files in the artifact by default;
          # v5.0.0 added this opt-in flag. We MUST include them — the
          # publish/wwwroot/.nojekyll file disables Jekyll on the deployed
          # Pages site, and without it Jekyll strips _framework/ (folders
          # starting with _) and the WASM app 404s on boot.
          include-hidden-files: true

  deploy:
    # Deploy only on direct pushes to main, not on PR builds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
